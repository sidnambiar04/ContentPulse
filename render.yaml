services:
  # Backend API
  - type: web
    name: contentpulse-backend
    env: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: contentpulse-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

  # Frontend Web
  - type: web
    name: contentpulse-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: contentpulse-backend
          property: host

databases:
  - name: contentpulse-db
    databaseName: contentpulse
    user: contentpulse_user
    plan: free
